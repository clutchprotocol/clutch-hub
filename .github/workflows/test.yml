# Run the test suite on every push and PR.
#
# There was no such job until now. `docker-publish.yml` builds the release binary, which proves
# the crate compiles but never compiles `#[cfg(test)]` code and never runs a test — so a green
# `main` said nothing about the suite. That covers proof-of-key-ownership verification, the
# cross-language SDK auth fixtures, and JWT secret validation: the pieces that decide who gets a
# token at all.
#
# No services block. Unlike clutch-treasury there is no database here; every test is in-process.

name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # AppConfig::load rejects empty and placeholder JWT secrets, so anything constructing a
      # config needs a real-looking one. Random, and only ever used by this rig.
      APP_JWT_SECRET: "iP8BoK3dJfTQGz5UyXq9NwL7e0vCmAhR6S2YxE1ZpDt4"

    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins 1.86.0; this action honours it rather than overriding it.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test
