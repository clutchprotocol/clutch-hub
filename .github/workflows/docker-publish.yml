# Builds and publishes the apps/demo image.
#
# Before the repos were merged this workflow checked THIS repo out beside the demo app to fake a
# monorepo layout, and the Dockerfile copied two sibling directories. Both are gone: there is one
# checkout and the build context is the workspace root.
#
# `packages/sdk/**` is in the paths filter on purpose. The demo bundles the SDK, so an SDK change
# changes the image — and under the old two-repo split it could not trigger this build at all,
# which meant the published image could lag the SDK indefinitely.
name: Build and Push Docker Image (GHCR)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
    paths:
      - 'apps/demo/**'
      - 'packages/sdk/**'
      - 'package.json'
      - 'package-lock.json'
      - '.dockerignore'
      - '.github/workflows/docker-publish.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/demo/**'
      - 'packages/sdk/**'
      - 'package.json'
      - 'package-lock.json'
      - '.dockerignore'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE: clutchprotocol/clutch-hub-demo-app

permissions:
  contents: read
  packages: write

jobs:
  # The Docker build proves the app compiles. It does not run a line of the keystore's own checks,
  # and those checks are mostly refusals -- wrong passphrase, altered ciphertext, an edited address
  # -- which is exactly the class of failure that looks like success from the UI when it stops
  # happening. So they gate the image rather than sit beside it.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      # One install for both workspaces. The SDK's `prepare` builds it as part of this.
      - name: Install
        run: npm ci
      - name: Build the SDK
        run: npm run build --workspace=clutch-hub-sdk-js
      - name: Test the demo app
        run: npm run test --workspace=clutch-hub-demo-app
      - name: Test the SDK
        run: npm run test --workspace=clutch-hub-sdk-js

  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/demo/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=http://localhost:3000

      - name: Image digest
        if: github.event_name != 'pull_request'
        run: echo ${{ steps.build.outputs.digest }}

    outputs:
      digest: ${{ steps.build.outputs.digest }}

  # Tell clutch-deploy to pin this image's tag and deploy stage. Requires org/repo secret
  # CLUTCH_DEPLOY_DISPATCH_TOKEN: PAT with repo scope able to POST repository_dispatch to clutch-deploy.
  #
  # This job used to carry `continue-on-error: true`. With the secret missing it failed, the run
  # still showed green, and stage quietly kept serving the previous image -- a deploy that does not
  # happen reporting success. That is the same failure shape as an nginx include matching no files:
  # it loads, it reports nothing wrong, and it does nothing. The repo has been bitten by that shape
  # four times in two days and it is written up in clutch-deploy/docs/ALERTING.md.
  #
  # Found for real when the workflow moved here from clutch-hub-demo-app on 2026-09-18 and its
  # three secrets did not come with it.
  trigger-stage-deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    steps:
      # Checked before the dispatch, not only by letting the action fail: an EMPTY token is the
      # likeliest way to get here, and it produces a vaguer error than a wrong one does.
      - name: Check the dispatch token is present
        env:
          TOKEN: ${{ secrets.CLUTCH_DEPLOY_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::CLUTCH_DEPLOY_DISPATCH_TOKEN is not set on this repository."
            echo "::error::The image WAS pushed. Stage will NOT deploy it."
            echo "::error::Add the secret (a PAT with repo scope), then either re-run this workflow or dispatch deploy-stage in clutch-deploy by hand."
            exit 1
          fi

      # clutch-deploy pins every image to an exact tag and deploys only what is pinned, so the
      # dispatch names the tag this run pushed: metadata-action's type=sha, sha-<first 7 of the
      # commit>. clutch-deploy checks that ghcr.io has it, pins it, and moves no other image.
      - name: Name the tag this run pushed
        id: tag
        run: echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Trigger deploy-stage in clutch-deploy
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CLUTCH_DEPLOY_DISPATCH_TOKEN }}
          repository: clutchprotocol/clutch-deploy
          event-type: deploy-stage
          client-payload: '{"set_images": "clutch-hub-demo-app=${{ steps.tag.outputs.sha }}"}'

      # The dispatch being accepted is not the deploy succeeding. Say so, so a green tick here is
      # not read as "stage is running the new image".
      - name: What this proves, and what it does not
        run: |
          echo "Dispatched deploy-stage to clutchprotocol/clutch-deploy."
          echo "That deploy is a separate run with its own result. This job only proves the request was accepted."
