# Builds the Hub API image and pushes it to GHCR as ghcr.io/clutchprotocol/clutch-hub-api.
#
# The Hub API moved into this repo on 2026-09-24, with its history, from clutchprotocol/clutch-hub-api.
# This file was that repo's docker-publish.yml. What changed in the move:
# - every path is under services/hub-api, and so is the Docker build context;
# - the `tags: v*` trigger is gone. In this repo those tags belong to the SDK's npm releases, so
#   every SDK release would have rebuilt the API image and tagged it with an SDK version;
# - the build cache has its own scope, so it does not overwrite the demo image's cache.
# The image name is unchanged, so clutch-deploy pulls the same image as before.
name: "Hub API: build and push image"

on:
  push:
    branches: [ main ]
    paths:
      - 'services/hub-api/src/**'
      - 'services/hub-api/Cargo.toml'
      - 'services/hub-api/Cargo.lock'
      - 'services/hub-api/Dockerfile'
      - '.github/workflows/hub-api-image.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'services/hub-api/src/**'
      - 'services/hub-api/Cargo.toml'
      - 'services/hub-api/Cargo.lock'
      - 'services/hub-api/Dockerfile'
  workflow_dispatch:

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE: clutchprotocol/clutch-hub-api

permissions:
  contents: read
  packages: write

jobs:
  hub-api-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: services/hub-api
          file: services/hub-api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=hub-api
          cache-to: type=gha,mode=max,scope=hub-api
          build-args: |
            RUST_VERSION=1.86

      - name: Image digest
        if: github.event_name != 'pull_request'
        run: echo ${{ steps.build.outputs.digest }}

    outputs:
      digest: ${{ steps.build.outputs.digest }}

  # Same secret as the other Clutch repos — PAT with repo access to dispatch on clutch-deploy.
  #
  # This job used to carry `continue-on-error: true`. With the secret missing it failed, the run
  # still reported green, and stage quietly kept serving the previous image. A deploy that does
  # not happen must not report success — see clutch-deploy/docs/ALERTING.md on that failure shape.
  hub-api-trigger-stage-deploy:
    needs: hub-api-image
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    steps:
      # Checked before the dispatch: an EMPTY token is the likeliest way to get here and fails
      # more vaguely than a wrong one.
      - name: Check the dispatch token is present
        env:
          TOKEN: ${{ secrets.CLUTCH_DEPLOY_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::CLUTCH_DEPLOY_DISPATCH_TOKEN is not set on this repository."
            echo "::error::The image WAS pushed. Stage will NOT deploy it."
            echo "::error::Add the secret (a PAT with repo scope), then re-run this workflow or dispatch deploy-stage in clutch-deploy by hand."
            exit 1
          fi

      - name: Trigger deploy-stage in clutch-deploy
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CLUTCH_DEPLOY_DISPATCH_TOKEN }}
          repository: clutchprotocol/clutch-deploy
          event-type: deploy-stage

      - name: What this proves, and what it does not
        run: |
          echo "Dispatched deploy-stage to clutchprotocol/clutch-deploy."
          echo "That deploy is a separate run with its own result. This job only proves the request was accepted."
