# Shows what the next SDK release would be. It publishes nothing.
#
# It runs the real .releaserc.json in dry-run mode on the pushed branch, as if that branch were
# main. Read the "semantic-release --dry-run" step. It ends with "no new version is released", or
# with "The next release version is X.Y.Z" and the release notes. Dry-run mode skips the prepare,
# publish and tag steps, so nothing here can publish.
#
# contents: write and the npm token are here only because semantic-release checks, even in
# dry-run mode, that it could push a tag and log in to npm. Run it by hand on any branch with:
#   gh workflow run release-dry-run.yml --ref <branch>
name: Release dry run

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'packages/sdk/**'
      - 'release/**'
      - '.releaserc.json'
      - '.github/workflows/release-dry-run.yml'
  workflow_dispatch:

jobs:
  dry-run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs every commit and tag

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test the release commit filter
        run: node --test release/sdk-commits.test.mjs

      - name: semantic-release --dry-run
        run: npx semantic-release --dry-run --branches "$GITHUB_REF_NAME"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
