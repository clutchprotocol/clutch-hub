<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Fonts are self-hosted locally (see src/index.css) to avoid external DNS/CDN dependencies. -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Clutch - Decentralized ride-sharing demo. Select pickup and dropoff on the map and submit ride requests via the Clutch Hub SDK." />
    <!-- One theme, so one theme-color. The dark value and its prefers-color-scheme pair went with
         the theme toggle; leaving them would paint the browser chrome dark around a light page. -->
    <meta name="theme-color" content="#f7f9ff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/clutch-logo.svg" />
    <title>Clutch</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
